name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Démarrer Docker
        run: docker compose -f cours_docker/docker-compose.yml up -d --build

      - name: Vérifier les conteneurs
        run: docker compose -f cours_docker/docker-compose.yml ps

      - name: Voir les logs
        run: docker compose -f cours_docker/docker-compose.yml logs

      - name: Tester l'application
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            echo "App pas prête, tentative $i/30..."
            sleep 2
          done
          echo "L'app n'a jamais répondu"
          docker compose -f cours_docker/docker-compose.yml logs app
          exit 1

      - name: Logs après le test
        if: always()
        run: docker compose -f cours_docker/docker-compose.yml logs app

      - name: Arrêter Docker
        if: always()
        run: docker compose -f cours_docker/docker-compose.yml down

      - name: Vérifier les fichiers
        run: |
          test -f bash-linux/index.html
          test -f bash-linux/js/script.js
          echo "Les fichiers existent !"
