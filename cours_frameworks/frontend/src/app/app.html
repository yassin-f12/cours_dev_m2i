<a class="skip-link" href="#contenu">Aller au contenu principal</a>

<div class="app" [class.app--nav-open]="menuOuvert()">
  <header class="app__header topbar">
    <button
      class="topbar__menu"
      type="button"
      [attr.aria-expanded]="menuOuvert()"
      aria-controls="navigation"
      (click)="basculerMenu()"
    >
      <svg
        class="nav__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="sr-only">
        {{ menuOuvert() ? 'Fermer le menu' : 'Ouvrir le menu' }}
      </span>
    </button>

    <a class="brand" href="/">
      <img class="brand__logo" src="/logo.svg" alt="" width="32" height="32" />
      TechCorp RH
    </a>

    <div class="topbar__actions">
      <div class="user">
        <span class="avatar" aria-hidden="true">CM</span>
        <div class="user__info">
          <p class="user__name">{{ currentUser.firstName }} {{ currentUser.lastName }}</p>
          <p class="user__role">{{ currentUser.jobTitle }}</p>
        </div>
      </div>
    </div>
  </header>

  <app-sidebar />

  <main class="app__main" id="contenu" tabindex="-1">
    <div class="container">
      <h1>Bonjour {{ currentUser.firstName }}</h1>

      <ul class="grid-auto stats-list" role="list">
        <li>
          <app-stat-card label="Congés payés restants" [value]="10" unit="jours" [max]="25" />
        </li>
        <li>
          <app-stat-card label="RTT restants" [value]="6" unit="jours" />
        </li>
      </ul>

      <section class="card" aria-labelledby="titre-prochain-conge">
        <h2 id="titre-prochain-conge">Prochain congé</h2>
        <p>
          {{ nextLeaveType }} du {{ nextLeave.startDate }} au
          {{ nextLeave.endDate }}
        </p>
      </section>

      <router-outlet />
    </div>
  </main>
</div>
