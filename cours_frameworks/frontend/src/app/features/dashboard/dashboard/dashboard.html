@let balance = leaves.paidLeaveBalance();

<div class="page-header">
  <div>
    <h1>Bonjour {{ session.currentUser().firstName }}</h1>
  </div>
</div>

<ul class="grid-auto list" role="list">
  <li>
    <app-stat-card
      label="Congés payés restants"
      unit="jours"
      [value]="balance.remaining"
      [max]="balance.total"
      [hint]="balance.taken + ' pris, ' + balance.pending + ' en attente, sur ' + balance.total"
    />
  </li>
  <li>
    <app-stat-card label="En attente de validation" [value]="balance.pending" unit="jours" />
  </li>
</ul>

<div class="grid-split mt-5">
  <section class="card" aria-labelledby="titre-nouvelle">
    <h2 id="titre-nouvelle" class="card__title mb-4">Nouvelle demande rapide</h2>

    <app-leave-quick-form [remaining]="balance.remaining" (submitted)="addLeave($event)" />
  </section>

  <section class="card" aria-labelledby="titre-demandes">
    <h2 id="titre-demandes" class="card__title mb-4">Mes demandes</h2>

    <app-leave-list [requests]="leaves.myRequests()" (cancelRequest)="cancelLeave($event)" />
  </section>
</div>
