<button
  class="topbar__menu"
  type="button"
  [attr.aria-expanded]="navOpen()"
  aria-controls="navigation"
  (click)="menuToggle.emit()"
>
  <svg
    class="nav__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M4 6h16M4 12h16M4 18h16" />
  </svg>
  <span class="sr-only">
    {{ navOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}
  </span>
</button>

<a class="brand" href="/">
  <img class="brand__logo" src="/logo.svg" alt="" width="32" height="32" />
  TechCorp RH
</a>

<div class="topbar__actions">
  <div class="user">
    <span class="avatar" aria-hidden="true">CM</span>
    <div class="user__info">
      <p class="user__name">{{ user().firstName }} {{ user().lastName }}</p>
      <p class="user__role">{{ user().jobTitle }}</p>
    </div>
  </div>
</div>
