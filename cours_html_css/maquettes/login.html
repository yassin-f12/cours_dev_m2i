<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Connexion - TechCorp RH</title>
    <meta name="description" content="Connexion à votre espace TechCorp RH." />

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body>
    <div class="auth">
      <aside class="auth__aside">
        <div>
          <strong>TechCorp RH</strong>
          <p>Votre espace ressources humaines.</p>
        </div>

        <p>© 2026 TechCorp RH</p>
      </aside>

      <main class="auth__main">
        <div class="auth__panel">
          <h1>Connexion</h1>

          <p>Utilisez votre adresse e-mail professionnelle.</p>

          <form class="form">
            <div class="field">
              <label class="field__label" for="email"> Adresse e-mail </label>
              <input
                class="input"
                id="email"
                type="email"
                autocomplete="username"
              />
            </div>

            <div class="field">
              <label class="field__label" for="password"> Mot de passe </label>
              <input
                class="input"
                id="password"
                type="password"
                autocomplete="current-password"
              />
            </div>

            <label class="checkbox">
              <input type="checkbox" />
              <span>Rester connecté</span>
            </label>

            <button class="btn btn--primary" type="submit">Se connecter</button>
          </form>

          <p>
            Pas encore de compte ?
            <a href="inscription.html">Créer un compte</a>
          </p>

          <footer>
            <a href="#">Mentions légales</a>
            <a href="#">Confidentialité</a>
            <a href="#">Accessibilité</a>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
