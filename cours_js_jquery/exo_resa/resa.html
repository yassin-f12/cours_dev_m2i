<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exo Réservation</title>
    <link
      rel="stylesheet"
      href="css/styles.css"
      media="screen"
      type="text/css"
    />
    <script src="js/script_resa.js" defer></script>
  </head>
  <body>
    <main class="reservation">
      <h1>Réservation</h1>

      <div class="ligne">
        <label for="">Nombre de billets</label>
        <input id="quantite" type="number" value="3" />
      </div>

      <div class="ligne">
        <label for="">Tarif réduit</label>

        <select name="" id="tarifReduit">
          <option value="non">Non</option>
          <option value="oui">Oui</option>
        </select>
      </div>

      <div class="ligne">
        <label for="">Assurance</label>

        <select name="" id="assurance">
          <option value="non">Non</option>
          <option value="oui">Oui</option>
        </select>
      </div>

      <div class="ligne">
        <label for="promo">Code promo</label>
        <input type="number" id="promo" placeholder="12587" />
        <span id="code"></span>
      </div>

      <button id="calculer">Calculer le prix</button>

      <section class="resultat">
        <p>
          Sous-Total :
          <strong id="sousTotal">0 €</strong>
        </p>

        <p>
          Réduction :
          <strong id="reduction">0 €</strong>
        </p>

        <p>
          Assurance :
          <strong id="prixAssurance">0 €</strong>
        </p>

        <p>
          Promo :
          <strong id="promoApp">0 €</strong>
        </p>

        <p>
          Frais :
          <strong id="frais">0 €</strong>
        </p>

        <div class="total">
          TOTAL :
          <span id="total">0 €</span>
        </div>

        <p id="message"></p>
      </section>
    </main>
  </body>
</html>
