<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style type="text/css">
      .content {
        width: 300px;
        height: 300px;
        background: #ccc;
        margin: 50px auto;
        position: relative;
        border-bottom-right-radius: 50%;
        box-shadow: 8px 5px 5px rgba(0, 0, 0, 0.4);
      }
      .child {
        width: 200px;
        height: 200px;
        background: #900;
        position: absolute;
        inset: -10px 0px 0px -10px;
        border-bottom-right-radius: 50%;
        box-shadow: 8px 5px 5px rgba(0, 0, 0, 0.4);
      }
      .p {
        width: 100px;
        height: 100px;
        background: blue;
        position: absolute;
        inset: -10px 0px 0px -10px;
        border-bottom-right-radius: 50%;
        box-shadow: 8px 5px 5px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="child">
        <div class="p"></div>
      </div>
    </div>
  </body>
</html>
