<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exo html css js</title>
    <style type="text/css">
      .content {
        width: 600px;
        height: 600px;
        background: #ccc;
        margin: 50px auto;
        position: relative;
      }
      .child {
        width: 100px;
        height: 100px;
        background: #900;
        position: absolute;
        bottom: 100px;
        left: 20px;
      }
      .tab {
        width: 50px;
        height: 50px;
        background: green;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-weight: bold;
        font-size: 34px;
        bottom: 300px;
        right: 40px;
        border-radius: 15px;
        cursor: pointer;
        border: none;
      }
    </style>
    <script src="carrer.js" defer></script>
  </head>
  <body>
    <div class="content">
      <div class="child"></div>
      <button class="tab">></button>
    </div>
  </body>
</html>
